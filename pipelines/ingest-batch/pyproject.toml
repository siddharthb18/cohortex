[project]
name = "cohortex-ingest-batch"
version = "0.0.0"
description = "C1 ingest-batch: Download Backblaze and Alibaba data, convert to the Parquet raw layer, bulk-load serving tables, reconcile."
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.5.6",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "pydantic==2.13.5",
]

[project.scripts]
cohortex-ingest = "cohortex_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cohortex_ingest"
