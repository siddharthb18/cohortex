# Cohortex fleet-api. Every setting can be overridden by environment variables (twelve-factor).
spring.application.name=fleet-api
server.port=${PORT:8080}
server.shutdown=graceful

# --- Serving store (Postgres + pgvector) -------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cohortex}
spring.datasource.username=${POSTGRES_USER:cohortex}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${FLEET_API_DB_POOL_SIZE:10}

# --- Flyway: applies the repo's db/migrations (V1 = contracts §2 DDL) on startup -----
# Local runs start in services/fleet-api; the Docker image sets FLYWAY_LOCATIONS=filesystem:/app/db/migrations.
spring.flyway.locations=${FLYWAY_LOCATIONS:filesystem:../../db/migrations}
spring.flyway.placeholders.embedding_dim=${EMBEDDING_DIM:384}

# --- Health (FR-OPS-4): /actuator/health, /actuator/health/liveness, /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# --- OpenAPI 3.1 (FR-API-7): /v3/api-docs and /swagger-ui.html ------------------------
springdoc.api-docs.version=openapi_3_1
springdoc.show-actuator=true
springdoc.writer-with-order-by-keys=true

# --- Errors are RFC 9457 problem details (ProblemDetailsAdvice); never leak traces -----
server.error.include-stacktrace=never
server.error.include-message=never
# If ingest-batch created the V1 schema first (make seed before fleet-api starts), adopt it as V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
