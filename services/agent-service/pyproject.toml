[project]
name = "cohortex-agent-service"
version = "0.0.0"
description = "C9 agent-service: Investigation API (FastAPI + LangGraph): single-agent and orchestrated modes, evidence ledger, claim checker, budgets, SSE step stream."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "langgraph==1.2.12",
  "mcp==2.2.0",
  "openai==3.24.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "sse-starlette==3.5.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "cohortex-mcp-fleet",
  "cohortex-mcp-stats",
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv.sources]
cohortex-mcp-fleet = { workspace = true }
cohortex-mcp-stats = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cohortex_agent"
