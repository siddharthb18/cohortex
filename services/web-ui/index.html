<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Cohortex: agentic reliability investigations over public HDD and SSD fleet telemetry, where every number links to its evidence."
        />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <title>Cohortex</title>
        <script>
            // Apply the saved theme before first paint to avoid a flash.
            try {
                var t = localStorage.getItem('cohortex-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
