server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/agent/ {
    proxy_pass http://agent-service:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # Server-sent events stream step by step
    proxy_cache off;
    proxy_read_timeout 300s;
  }
  location /api/fleet/ {
    proxy_pass http://fleet-api:8080/;
  }
  location / {
    try_files $uri /index.html;
  }
}
