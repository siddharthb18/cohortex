name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --locked
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test-python

  java:
    name: java (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build

  compose:
    name: compose (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose -f deploy/compose/docker-compose.yml --env-file .env config -q

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Added by later work packages: contract tests (WP-04/05), image build + Trivy (WP-17),
  # eval gate on recorded responses (WP-07), nightly live eval and k6 (WP-07/WP-12).
