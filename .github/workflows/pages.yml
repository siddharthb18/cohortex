name: demo (GitHub Pages)

# Publishes the static demo build (a recorded live investigation over real Backblaze data) to
# https://<owner>.github.io/cohortex/. Enable once: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["services/web-ui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults: {run: {working-directory: services/web-ui}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: services/web-ui/package-lock.json}
      - run: npm ci
      - run: npm run build:demo
        env: {VITE_BASE: "/${{ github.event.repository.name }}/"}
      - uses: actions/upload-pages-artifact@v5
        with: {path: services/web-ui/dist-demo}
      - id: deployment
        uses: actions/deploy-pages@v5
