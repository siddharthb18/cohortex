[project]
name = "cohortex-evals"
version = "0.1.0"
description = "C11 eval-harness: Golden-set loader, truth runner (DuckDB over the raw layer), graders, judge, reports, CI gate."
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.5.6",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
cohortex-eval = "cohortex_evals.cli:main"

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cohortex_evals"
