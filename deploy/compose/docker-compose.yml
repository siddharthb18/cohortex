# Local infrastructure for Cohortex (WP-00). Application services are added by later work packages.
# Run from the repo root with:  make up   (or: docker compose -f deploy/compose/docker-compose.yml --env-file .env up -d)
name: cohortex

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cohortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cohortex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly with the partitions in docs/specs/contracts.md §3 (WP-13).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC from services on the host
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686" # Jaeger UI; its OTLP ports stay internal (the collector forwards to them)

  # ---------------------------------------------------------------- application services
  fleet-api:
    build: {context: ../.., dockerfile: services/fleet-api/Dockerfile}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-cohortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cohortex}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}

  mcp-fleet:
    build: {context: ../.., dockerfile: deploy/docker/python.Dockerfile, args: {PACKAGE: cohortex-mcp-fleet, MODULE: cohortex_mcp_fleet}}
    environment: {FLEET_API_URL: "http://fleet-api:8080"}
    ports: ["8101:8101"]
    restart: unless-stopped
    depends_on: {fleet-api: {condition: service_healthy}}

  mcp-stats:
    build: {context: ../.., dockerfile: deploy/docker/python.Dockerfile, args: {PACKAGE: cohortex-mcp-stats, MODULE: cohortex_mcp_stats}}
    ports: ["8102:8102"]

  agent-service:
    build: {context: ../.., dockerfile: deploy/docker/python.Dockerfile, args: {PACKAGE: cohortex-agent-service, MODULE: cohortex_agent}}
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cohortex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cohortex}
      MCP_FLEET_URL: http://mcp-fleet:8101/mcp
      MCP_STATS_URL: http://mcp-stats:8102/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8000:8000"]
    restart: unless-stopped
    # fleet-api runs the Flyway migration, so the tables exist once it is healthy.
    depends_on:
      fleet-api: {condition: service_healthy}
      mcp-fleet: {condition: service_started}
      mcp-stats: {condition: service_started}

  web-ui:
    build: {context: ../.., dockerfile: services/web-ui/Dockerfile}
    ports: ["5173:80"]
    depends_on: [agent-service, fleet-api]

  # One-shot data loader: docker compose ... run --rm ingest seed   (or: backfill --quarter 2026Q2)
  ingest:
    profiles: ["tools"]
    build: {context: ../.., dockerfile: deploy/docker/python.Dockerfile, args: {PACKAGE: cohortex-ingest-batch, MODULE: cohortex_ingest}}
    entrypoint: ["cohortex-ingest"]
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cohortex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cohortex}
      RAW_DATA_URI: /app/data/raw
      COHORTEX_DUCKDB_MEMORY_LIMIT: 4GB
    volumes:
      - ../../data:/app/data
    depends_on: {postgres: {condition: service_healthy}}

volumes:
  pgdata:
