openapi: 3.1.0
info:
  title: Cohortex fleet-api
  version: v1
  summary: Read-only reliability API over Backblaze HDD and Alibaba SSD telemetry.
  description: |
    Generated by hand from docs/specs/contracts.md §4 and docs/implementation-notes.md §5 (WP-04);
    from now on this file is the source of truth for the fleet-api boundary. The running service
    serves its own generated document at `/v3/api-docs`; a contract test (OpenApiContractIT) checks
    that the served document contains every path and method listed here.

    - Dates are ISO 8601 (`YYYY-MM-DD`). Windows `[from, to]` are inclusive.
    - A window touching more than 8 calendar quarters, or with `to < from`, is rejected with 400.
    - Pages are 0-based; `size` is 1..500 (FR-API-8).
    - AFR is `failures * 365 * 100 / drive_days` (percent) with an exact Poisson 95% interval
      (ADR-007); every AFR-bearing response carries `method: exact_poisson_95` and `generated_at`.
    - Every error is an RFC 9457 `application/problem+json` body.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: fleet
    description: Models, fleet totals and alerts
  - name: cohorts
    description: Per-model AFR, comparison, SMART trends and failed drives
  - name: health
    description: Liveness and readiness (Spring Boot Actuator)

paths:
  /v1/models:
    get:
      tags: [fleet]
      operationId: models
      summary: List drive models
      description: "`drive_count` is the model's drive count on its latest day in `cohort_daily` (0 if it has none)."
      parameters:
        - name: source
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Source" }
        - name: media
          in: query
          required: false
          schema: { type: string, enum: [hdd, ssd] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of models ordered by source, then model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/cohorts/{source}/{model}/afr:
    get:
      tags: [cohorts]
      operationId: afr
      summary: AFR series of one cohort with exact Poisson 95% intervals
      description: >-
        Drive-days, failures and AFR (percent) per quarter (`2026Q2`) or month (`2026-05`) inside
        `[from, to]`; a period partly outside the window only counts its days inside it. Periods
        without drive-days are omitted.
      parameters:
        - $ref: "#/components/parameters/SourcePath"
        - $ref: "#/components/parameters/ModelPath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Granularity"
      responses:
        "200":
          description: AFR series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AfrSeries" }
              example:
                source: backblaze
                model: ST12000NM000J
                series:
                  - { period: 2026Q2, drive_days: 98189, failures: 0, afr_pct: 0.0, ci_low_pct: 0.0, ci_high_pct: 1.37 }
                method: exact_poisson_95
                generated_at: "2026-10-02T16:20:11Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/cohorts/compare:
    get:
      tags: [cohorts]
      operationId: compare
      summary: Rank cohorts of a source by AFR with rate ratios against the fleet
      description: >-
        A model qualifies when its `drive_count` on its last day inside the window is at least
        `min_drives`. `rate_ratio_vs_fleet` is the model AFR divided by the AFR of all models of
        the source in the window (`fleet_afr_pct`); null when the fleet AFR is 0. Ranked by
        `afr_pct` descending, ties by `model` ascending, cut to `limit`.
      parameters:
        - name: source
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Source" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: min_drives
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0, default: 60 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Ranked cohorts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/cohorts/{source}/{model}/smart-trend:
    get:
      tags: [cohorts]
      operationId: smartTrend
      summary: SMART attribute trend over the 1% sampled drives
      description: >-
        For sampled drives only (`drive.sampled`): p50 and p95 of `raw_value` (`percentile_cont`),
        the share of drive-days with `raw_value > 0`, and the number of distinct sampled drives,
        per period.
      parameters:
        - $ref: "#/components/parameters/SourcePath"
        - $ref: "#/components/parameters/ModelPath"
        - name: attr
          in: query
          required: true
          description: >-
            A SMART attribute kept for the source. backblaze: 5, 9, 12, 187, 188, 193, 194, 197,
            198, 199, 240, 241, 242. alibaba: 5, 9, 12, 171, 172, 173, 174, 175, 187, 188, 194,
            195, 199.
          schema: { type: integer, format: int32 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Granularity"
      responses:
        "200":
          description: SMART trend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmartTrend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/cohorts/{source}/{model}/failed-drives:
    get:
      tags: [cohorts]
      operationId: failedDrives
      summary: Failed drives of a cohort with age at failure and last SMART values
      description: >-
        Drives with `failed_on` in the window, ordered by `failed_on` then `drive_id`.
        `age_days = failed_on - first_seen`; `last_smart` maps attribute id to the raw value
        recorded on `failed_on` (empty object when none was recorded).
      parameters:
        - $ref: "#/components/parameters/SourcePath"
        - $ref: "#/components/parameters/ModelPath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of failed drives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailedDrivePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/fleet/summary:
    get:
      tags: [fleet]
      operationId: fleetSummary
      summary: Fleet totals of a source in a window
      description: >-
        `drives` = distinct drives with `first_seen <= to` and `last_seen >= from`; drive-days,
        failures and AFR with its exact Poisson 95% interval over all models of the source. AFR
        fields are null when the window has no drive-days.
      parameters:
        - name: source
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Source" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Fleet totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/alerts:
    get:
      tags: [fleet]
      operationId: alerts
      summary: List cohort alerts, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, resolved] }
        - name: source
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Source" }
      responses:
        "200":
          description: Alerts ordered by `opened_at` descending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /actuator/health:
    get:
      tags: [health]
      operationId: health
      summary: Overall health
      description: >-
        Spring Boot Actuator. Liveness and readiness groups are served at
        `/actuator/health/liveness` and `/actuator/health/readiness` (readiness includes the
        database).
      responses:
        "200":
          description: UP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: DOWN or OUT_OF_SERVICE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

components:
  parameters:
    SourcePath:
      name: source
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Source" }
    ModelPath:
      name: model
      in: path
      required: true
      description: Model name exactly as stored in `drive_model.model`; unknown models return 404.
      schema: { type: string }
    From:
      name: from
      in: query
      required: true
      description: First day of the window, inclusive.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      description: Last day of the window, inclusive. At most 8 calendar quarters after `from`'s quarter.
      schema: { type: string, format: date }
    Granularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [quarter, month], default: quarter }
    Page:
      name: page
      in: query
      required: false
      description: 0-based page number.
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      description: Rows per page.
      schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 100 }

  responses:
    BadRequest:
      description: Invalid parameter (bad value, window over 8 quarters, page size over 500).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: window 2024-04-01..2026-06-30 spans 9 quarters; at most 8 are allowed
            instance: /v1/cohorts/backblaze/ST12000NM000J/afr
    NotFound:
      description: Unknown model (or unknown route).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: unknown model 'NOPE' for source backblaze
            instance: /v1/cohorts/backblaze/NOPE/afr
    InternalError:
      description: Unexpected server error (no stack trace is returned).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    Source:
      type: string
      enum: [backblaze, alibaba]

    ProblemDetail:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string, format: uri }
      required: [title, status]

    ModelItem:
      type: object
      required: [id, source, model, media, capacity_bytes, drive_count]
      properties:
        id: { type: integer, format: int32 }
        source: { $ref: "#/components/schemas/Source" }
        model: { type: string }
        media: { type: string, enum: [hdd, ssd] }
        capacity_bytes:
          type: [integer, "null"]
          format: int64
          description: Most common positive capacity; null for Alibaba.
        drive_count: { type: integer, format: int64 }

    ModelPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModelItem" }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        total: { type: integer, format: int64 }

    AfrPoint:
      type: object
      required: [period, drive_days, failures, afr_pct, ci_low_pct, ci_high_pct]
      properties:
        period: { type: string, description: "`YYYYQn` or `YYYY-MM`", examples: ["2026Q2", "2026-05"] }
        drive_days: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        afr_pct: { type: number, format: double }
        ci_low_pct: { type: number, format: double }
        ci_high_pct: { type: number, format: double }

    AfrSeries:
      type: object
      required: [source, model, series, method, generated_at]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        model: { type: string }
        series:
          type: array
          items: { $ref: "#/components/schemas/AfrPoint" }
        method: { type: string, const: exact_poisson_95 }
        generated_at: { type: string, format: date-time }

    CompareItem:
      type: object
      required: [model, drive_days, failures, afr_pct, ci_low_pct, ci_high_pct, rate_ratio_vs_fleet]
      properties:
        model: { type: string }
        drive_days: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        afr_pct: { type: number, format: double }
        ci_low_pct: { type: number, format: double }
        ci_high_pct: { type: number, format: double }
        rate_ratio_vs_fleet: { type: [number, "null"], format: double }

    CompareResult:
      type: object
      required: [source, from, to, min_drives, fleet_afr_pct, cohorts, method, generated_at]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        min_drives: { type: integer, format: int32 }
        fleet_afr_pct:
          type: [number, "null"]
          format: double
          description: AFR of all models of the source in the window; null when there are no drive-days.
        cohorts:
          type: array
          items: { $ref: "#/components/schemas/CompareItem" }
        method: { type: string, const: exact_poisson_95 }
        generated_at: { type: string, format: date-time }

    SmartTrendPoint:
      type: object
      required: [period, p50, p95, nonzero_share, n_drives]
      properties:
        period: { type: string }
        p50: { type: [number, "null"], format: double }
        p95: { type: [number, "null"], format: double }
        nonzero_share: { type: number, format: double, minimum: 0, maximum: 1 }
        n_drives: { type: integer, format: int64, description: Distinct sampled drives in the period. }

    SmartTrend:
      type: object
      required: [source, model, attr, series, generated_at]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        model: { type: string }
        attr: { type: integer, format: int32 }
        series:
          type: array
          items: { $ref: "#/components/schemas/SmartTrendPoint" }
        generated_at: { type: string, format: date-time }

    FailedDrive:
      type: object
      required: [drive_id, failed_on, age_days, last_smart]
      properties:
        drive_id: { type: string }
        failed_on: { type: string, format: date }
        age_days: { type: integer, format: int32 }
        last_smart:
          type: object
          description: SMART attribute id (as a string key) to raw value on `failed_on`.
          additionalProperties: { type: [number, "null"], format: double }

    FailedDrivePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FailedDrive" }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        total: { type: integer, format: int64 }

    FleetSummary:
      type: object
      required: [source, from, to, drives, drive_days, failures, afr_pct, ci_low_pct, ci_high_pct, method, generated_at]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        drives: { type: integer, format: int64 }
        drive_days: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        afr_pct: { type: [number, "null"], format: double }
        ci_low_pct: { type: [number, "null"], format: double }
        ci_high_pct: { type: [number, "null"], format: double }
        method: { type: string, const: exact_poisson_95 }
        generated_at: { type: string, format: date-time }

    AlertItem:
      type: object
      description: One `alert` row (contracts §2) with its model's source and name.
      required: [id, model_id, source, model, opened_at, window_start, window_end, baseline_afr, current_afr, rate_ratio, p_value, status, resolved_at]
      properties:
        id: { type: string, format: uuid }
        model_id: { type: integer, format: int32 }
        source: { $ref: "#/components/schemas/Source" }
        model: { type: string }
        opened_at: { type: string, format: date-time }
        window_start: { type: string, format: date }
        window_end: { type: string, format: date }
        baseline_afr: { type: number, format: double }
        current_afr: { type: number, format: double }
        rate_ratio: { type: number, format: double }
        p_value: { type: number, format: double }
        status: { type: string, enum: [open, resolved] }
        resolved_at: { type: [string, "null"], format: date-time }

    AlertList:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertItem" }
        generated_at: { type: string, format: date-time }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
        components: { type: object, additionalProperties: true }
        groups: { type: array, items: { type: string } }
