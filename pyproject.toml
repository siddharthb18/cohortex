# Root of the Cohortex uv workspace. The root itself is not a package; members are listed below.
[project]
name = "cohortex-workspace"
version = "0.0.0"
description = "Cohortex monorepo workspace root"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "services/agent-service",
  "mcp/*",
  "pipelines/*",
  "evals/harness",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["services/web-ui", "docs"]  # docs/specs are verbatim exports of the spec doc

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "PT", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["services/agent-service/tests", "mcp", "pipelines", "evals/harness/tests"]
