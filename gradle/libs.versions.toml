# Java version catalog. Pinned 2026-10-02 (docs/versions.md); Spring Boot's BOM manages
# Spring, Kafka, Flyway, Jackson and JUnit versions, so they are not repeated here.
[versions]
java = "25"
spring-boot = "4.1.1"
springdoc = "3.1.1"
testcontainers = "2.0.5"
spotless = "8.10.3"
google-java-format = "1.37.0"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
commons-statistics = "1.3"

[libraries]
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
commons-statistics-distribution = { module = "org.apache.commons:commons-statistics-distribution", version.ref = "commons-statistics" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
